plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = project.mod_version
group = 'net.noopsnet'
base { archivesName = 'noopsnet-core' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral() }
sourceSets { client; gametest }
[sourceSets.client, sourceSets.gametest].each { set ->
    set.compileClasspath += sourceSets.main.output
    set.runtimeClasspath += sourceSets.main.output
}
configurations.clientImplementation.extendsFrom configurations.implementation
configurations.gametestImplementation.extendsFrom configurations.implementation
neoForge {
    enable { version = project.neo_version; disableRecompilation = true }
    addModdingDependenciesTo sourceSets.client
    addModdingDependenciesTo sourceSets.gametest
    mods { noopsnet_core { sourceSet sourceSets.main; sourceSet sourceSets.client; sourceSet sourceSets.gametest } }
    runs {
        gameTestServer {
            type = 'gameTestServer'; sourceSet = sourceSets.gametest
            loadedMods = [mods.noopsnet_core]
            systemProperty 'neoforge.enabledGameTestNamespaces', 'noopsnet_core'
        }
        smokeServer { server(); programArgument '--nogui'; gameDirectory = file('run/smoke'); jvmArguments.add '-Xmx2G' } }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.named('runSmokeServer') { standardInput = System.in }

dependencies { testImplementation 'com.google.code.gson:gson:2.10.1'; testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
test { useJUnitPlatform() }

tasks.named('jar') { from sourceSets.client.output }
tasks.named('sourcesJar') { from sourceSets.client.allSource }
tasks.named('runGameTestServer') { doFirst { delete file('run/logs/latest.log') } }
tasks.register('verifyGameTests') {
    dependsOn tasks.named('runGameTestServer')
    doLast {
        if (!file('run/logs/latest.log').text.contains('All 11 required tests passed'))
            throw new GradleException('Core GameTests did not pass')
    }
}

// Include the code license and resource notices in public artifacts.
tasks.named('jar') { from('LICENSE'); from('NOTICE.md') }
